# Local integration-testing stack ONLY - runs backend + frontend + a local
# MongoDB against each other exactly like production would, without needing
# a real MongoDB Atlas cluster or a live UiPath agent for basic smoke-testing.
#
# This is NOT the production deployment target. Production uses MongoDB
# Atlas (managed, replicated, backed up) - see DEPLOYMENT.md. The `mongo`
# service below is a throwaway local container with no persistence
# guarantees, no auth hardening, and no backups.
#
# Usage:
#   cp backend/src/main/resources/application.properties.example backend/.env.docker   # then trim to just the vars below
#   docker compose up --build
#   Frontend: http://localhost:5173   Backend: http://localhost:8080

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/examquizai
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell or a .env file - see backend README}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ADMIN_SEED_ENABLED: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@examquizai.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your shell or a .env file}
      # UiPath vars are optional for local smoke-testing everything except
      # quiz generation - leave blank to run the rest of the app without them.
      UIPATH_BASE_URL: ${UIPATH_BASE_URL:-}
      UIPATH_AGENT_ENDPOINT: ${UIPATH_AGENT_ENDPOINT:-}
      UIPATH_TOKEN_URL: ${UIPATH_TOKEN_URL:-}
      UIPATH_TENANT_NAME: ${UIPATH_TENANT_NAME:-}
      UIPATH_CLIENT_ID: ${UIPATH_CLIENT_ID:-}
      UIPATH_CLIENT_SECRET: ${UIPATH_CLIENT_SECRET:-}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip static assets - meaningful bandwidth savings on the JS bundle
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers. The backend sets its own (see SecurityConfig.java);
    # these apply to the HTML/JS the browser actually renders, which is the
    # layer that matters for things like clickjacking and MIME-sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Adjust connect-src if VITE_API_BASE_URL points somewhere other than
    # what's listed here - CSP is an allowlist, not a suggestion.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # Hashed filenames (Vite's default output) can be cached aggressively -
    # a new deploy produces new filenames, so there's no staleness risk.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: React Router handles routing client-side (BrowserRouter),
    # so any path Nginx doesn't recognize as a real file must still serve
    # index.html - otherwise refreshing on e.g. /dashboard 404s at the
    # webserver level before React Router ever gets a chance to run.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

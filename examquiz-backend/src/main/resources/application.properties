# =========================================
# ExamQuiz AI - Backend Configuration
# =========================================

# ---------- Application ----------
spring.application.name=examquiz-backend
server.port=${PORT:8080}
server.servlet.context-path=/

# ---------- MongoDB Atlas ----------
# Keep connection details in environment variables; never commit credentials to source.

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:examquizai}

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP_MS:3600000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP_MS:604800000}
app.jwt.issuer=examquiz-ai

# ---------- Bootstrap ADMIN account ----------
app.admin.seed-enabled=${ADMIN_SEED_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@examquizai.com}
app.admin.password=${ADMIN_PASSWORD}
app.admin.full-name=${ADMIN_FULL_NAME:Platform Administrator}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://quiz-app-git-main-jeeva-t.vercel.app,https://quiz-app-jeeva-t.vercel.app}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ---------- UiPath Agentic AI integration ----------
app.uipath.base-url=https://cloud.uipath.com/recaiwqgzl/DefaultTenant/orchestrator_
app.uipath.token-url=https://cloud.uipath.com/recaiwqgzl/identity_/connect/token
app.uipath.tenant-name=DefaultTenant
app.uipath.client-id=${UIPATH_CLIENT_ID}
app.uipath.client-secret=${UIPATH_CLIENT_SECRET}
app.uipath.scope=OR.Execution OR.Jobs

# New properties we need to add
app.uipath.folder-id=440645
app.uipath.release-key=6c8244f2-c831-4843-9d12-5cd2c6f0fbf9

# ---------- UiPath Timeouts ----------
app.uipath.poll-interval-ms=2000
app.uipath.max-poll-attempts=60

# ---------- UiPath Retry ----------
app.uipath.max-retry-attempts=10
app.uipath.retry-backoff-ms=5000

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.examquizai.backend=DEBUG
logging.level.org.springframework.security=INFO


# ---------- Jackson ----------
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---------- OpenAPI / Swagger ----------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html